<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية - الأستاذ يحيى عوض</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrapper {
            max-width: 1000px;
            width: 100%;
            margin: 20px auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            margin-bottom: 25px;
        }
        .admin-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .admin-card h2 {
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-grid-user {
            display: grid;
            grid-template-columns: 1.5fr 1.5fr auto;
            gap: 12px;
            align-items: center;
        }
        .form-grid-course {
            display: grid;
            grid-template-columns: 1.5fr 2fr auto;
            gap: 12px;
            align-items: center;
        }
        .form-grid-video {
            display: grid;
            grid-template-columns: 1.5fr 2fr auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .form-grid-hw {
            display: grid;
            grid-template-columns: 1.5fr 2fr 90px auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        /* نافذة الطلاب المنبثقة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid #334155;
            width: 90%; max-width: 600px; max-height: 80vh;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 15px;
        }
        .modal-body { overflow-y: auto; flex: 1; padding-left: 5px; }
        .close-modal { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: #ef4444; }

        @media (max-width: 768px) {
            .form-grid-user, .form-grid-course, .form-grid-video, .form-grid-hw {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body style="justify-content: flex-start;">

    <div class="admin-wrapper">
        <!-- الهيدر العلوي -->
        <div class="admin-header">
            <div>
                <h1 style="font-size: 22px; color: #f8fafc;"><i class="fa-solid fa-sliders" style="color: #a78bfa;"></i> لوحة التحكم الرئيسية</h1>
                <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;">إدارة الطلاب، الوحدات، الفيديوهات والامتحانات بمرونة عالية</p>
            </div>
            <button class="btn-glow" style="width: auto; padding: 10px 18px;" onclick="openStudentsModal()"><i class="fa-solid fa-users-gear"></i> عرض الطلاب المسجلين</button>
        </div>

        <!-- إضافة طالب جديد -->
        <div class="admin-card">
            <h2><i class="fa-solid fa-user-plus"></i> إضافة طالب جديد للمنصة</h2>
            <div class="form-grid-user">
                <input type="text" id="new-username" placeholder="اسم المستخدم (Username)">
                <input type="text" id="new-code" placeholder="كود الدخول (Code)">
                <button class="btn-glow" onclick="addUser()">إضافة الطالب</button>
            </div>
            <div id="add-user-msg" style="font-size: 13px; margin-top: 8px;"></div>
        </div>

        <!-- إنشاء وحدة تعليمية جديدة -->
        <div class="admin-card">
            <h2><i class="fa-solid fa-folder-plus"></i> إنشاء وحدة تعليمية جديدة</h2>
            <div class="form-grid-course">
                <input type="text" id="course-title" placeholder="عنوان الوحدة (مثال: الوحدة الأولى)">
                <input type="text" id="course-desc" placeholder="وصف موجز للوحدة">
                <button class="btn-glow" style="background: linear-gradient(135deg, #0284c7, #0369a1);" onclick="addCourse()">إنشاء الوحدة</button>
            </div>
        </div>

        <!-- قائمة الوحدات الحالية -->
        <div class="admin-card">
            <h2><i class="fa-solid fa-layer-group"></i> الوحدات، الفيديوهات والامتحانات الحالية</h2>
            <div id="admin-courses-list"></div>
        </div>
    </div>

    <!-- النافذة المنبثقة لعرض ا* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #090d16;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.bg-glow {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, rgba(14, 165, 233, 0.06) 50%, transparent 70%);
    filter: blur(100px);
    z-index: -1;
}

/* بانر التواصل العلوي */
.top-contact-banner {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-bottom: 20px;
}

.contact-pill {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    color: #cbd5e1;
    transition: all 0.3s;
}

.contact-pill.website {
    background: rgba(168, 85, 247, 0.15);
    border-color: rgba(168, 85, 247, 0.4);
    color: #c084fc;
    font-weight: bold;
}

.contact-pill.teacher {
    background: rgba(34, 197, 94, 0.15);
    border-color: rgba(34, 197, 94, 0.4);
    color: #4ade80;
}

.contact-pill.admin {
    background: rgba(56, 189, 248, 0.15);
    border-color: rgba(56, 189, 248, 0.4);
    color: #38bdf8;
}

.login-wrapper {
    width: 100%;
    max-width: 480px;
    padding: 20px;
}

.login-card {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
}

.brand-logo { font-size: 55px; color: #38bdf8; margin-bottom: 12px; }
.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }

.input-group { text-align: right; margin-bottom: 18px; }
.input-group label { font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 8px; }

input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 13px 18px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    color: white;
    outline: none;
    transition: all 0.3s;
}

input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }

.btn-primary-glow, .btn-glow {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #0284c7, #7c3aed);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    transition: transform 0.2s;
}

.btn-primary-glow:hover, .btn-glow:hover { transform: translateY(-2px); }

.btn-danger-glow {
    background: #ef4444; border: none; padding: 8px 14px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold;
}

.main-container { width: 100%; max-width: 1200px; padding: 25px; }

.top-bar {
    display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.5); padding: 16px 25px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 30px;
}

.user-info { display: flex; align-items: center; gap: 12px; }
.avatar { font-size: 30px; color: #a78bfa; }
.status-online { font-size: 12px; color: #22c55e; }
.btn-logout { background: #ef4444; border: none; padding: 8px 16px; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; }

.courses-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px;
}

.course-card {
    background: rgba(30, 41, 59, 0.4); border: 1px solid #334155; border-radius: 20px; padding: 25px; cursor: pointer; transition: all 0.3s;
}

.course-card:hover { border-color: #38bdf8; transform: translateY(-6px); background: rgba(30, 41, 59, 0.7); }
.card-tag { font-size: 12px; color: #a78bfa; margin-bottom: 12px; }
.card-footer { display: flex; justify-content: space-between; margin-top: 20px; font-size: 12px; color: #94a3b8; }

/* مشغل الفيديو المزود بـ 2 Shields لمنع الضغط على أي عنصر في يوتيوب */
.content-split { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }

.video-box {
    position: relative; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid #334155;
}

.video-box iframe { width: 100%; height: 100%; }

/* الطبقة العلوية لحماية اسم القناة وزر المشاركة */
.shield-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 65px; z-index: 10;
}

/* الطبقة السفلى لمنع الضغط على شعار يوتيوب السفلي */
.shield-bottom {
    position: absolute; bottom: 0; left: 0; width: 120px; height: 50px; z-index: 10;
}

.sidebar-box {
    background: rgba(15, 23, 42, 0.7); border: 1px solid #334155; border-radius: 20px; padding: 20px; max-height: 540px; display: flex; flex-direction: column;
}

.tabs-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.tab-btn { padding: 11px; background: #0f172a; border: 1px solid #334155; color: #cbd5e1; border-radius: 10px; cursor: pointer; font-size: 13px; }
.tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8; }
.tab-content { display: none; overflow-y: auto; flex: 1; }
.tab-content.active { display: block; }

.playlist-item {
    display: flex; justify-content: space-between; align-items: center; padding: 13px; background: #0f172a; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid #334155;
}

.playlist-item:hover, .playlist-item.active { border-color: #a78bfa; background: #1e293b; }

.exam-card { background: #0f172a; border: 1px solid #334155; padding: 18px; border-radius: 14px; margin-bottom: 18px; }
.exam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

.q-block { padding: 10px 0; border-bottom: 1px solid #1e293b; }
.q-title { font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 8px; }

.options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.opt-btn {
    background: #1e293b; border: 1px solid #334155; padding: 8px; border-radius: 8px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px;
}

.btn-pdf-download { padding: 6px 14px; background: #334155; color: white; text-decoration: none; border-radius: 8px; font-size: 12px; }
.btn-submit-exam { width: 100%; padding: 12px; background: #22c55e; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }

.btn-back { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
.glow-title { color: #a78bfa; }
.error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; }

@media (max-width: 768px) {
    .content-split { grid-template-columns: 1fr; }
}لطلاب (مرتبة ومنظمة في صف واحد) -->
    <div class="modal-overlay" id="studentsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="color: white; font-size: 16px;"><i class="fa-solid fa-users" style="color: #38bdf8;"></i> قائمة الطلاب المسجلين</h3>
                <button class="close-modal" onclick="closeStudentsModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="users-list"></div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
